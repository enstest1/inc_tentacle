[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# PINNED. Do not change without a documented reason in docs/AUDIT_SCOPE.md.
solc_version = "0.8.36"

# PINNED. Solidity's DEFAULT evm_version has moved to prague (0.8.30) and then
# osaka (0.8.31). Ink does not document a Solidity evm_version; Cancun bytecode
# remains a deployable subset of later OP Stack forks (Ecotone through Karst).
# Confirmed against Ink docs + Superchain registry on 2026-08-25.
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false

bytecode_hash = "none"   # deterministic builds; no IPFS metadata hash
cbor_metadata = false

# Write access is required so deploy scripts can emit ../deployments/*.json
# (spec §17.2). Path is relative to this Foundry root (contracts/).
fs_permissions = [{ access = "read-write", path = "../deployments" }]

gas_reports = ["TentacleBatcher"]

[profile.default.fuzz]
runs = 512

[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 1000
depth = 100

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
ink = "https://rpc-gel.inkonchain.com"
ink_sepolia = "https://rpc-gel-sepolia.inkonchain.com"
